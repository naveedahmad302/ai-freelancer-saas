version: "3.9"

services:
  # ─── Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_WS_URL=ws://localhost:4000
    depends_on:
      - gateway
    networks:
      - app-network

  # ─── API Gateway (Node.js / Express) ──────────────────────
  gateway:
    build:
      context: ./packages/gateway
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/freelancer_saas
      - MONGODB_URI=mongodb://mongo:27017/freelancer_saas
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    depends_on:
      - postgres
      - mongo
      - redis
      - ai-service
    networks:
      - app-network

  # ─── AI Service (FastAPI / Python) ─────────────────────────
  ai-service:
    build:
      context: ./packages/ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/freelancer_saas
      - MONGODB_URI=mongodb://mongo:27017/freelancer_saas
      - REDIS_URL=redis://redis:6379
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX=${PINECONE_INDEX:-freelancer-memory}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    depends_on:
      - postgres
      - mongo
      - redis
    networks:
      - app-network

  # ─── Automation Worker (Playwright) ────────────────────────
  automation:
    build:
      context: ./packages/automation
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - GATEWAY_URL=http://gateway:4000
      - BROWSER_PROFILES_DIR=/data/browser-profiles
    volumes:
      - browser-profiles:/data/browser-profiles
    depends_on:
      - redis
      - gateway
    networks:
      - app-network

  # ─── n8n Workflow Engine ───────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-admin}
      - WEBHOOK_URL=http://n8n:5678
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=postgres
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows
    depends_on:
      - postgres
    networks:
      - app-network

  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_MULTIPLE_DATABASES=freelancer_saas,n8n
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
      - ./database/postgres/migrations:/docker-entrypoint-initdb.d/migrations
    networks:
      - app-network

  # ─── MongoDB ───────────────────────────────────────────────
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./database/mongo/init:/docker-entrypoint-initdb.d
    networks:
      - app-network

  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - app-network

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  n8n-data:
  browser-profiles:

networks:
  app-network:
    driver: bridge
